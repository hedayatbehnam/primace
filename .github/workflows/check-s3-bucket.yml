on:
  push:
    branches: [main, arg-pkg]
    
  schedule:
    - cron: '* 7 * * *'

name: S3-Bucket-Connection

jobs:

  liara_cloud_storage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "16"
          
      - name: install aws-sdk
        run: |
          npm install aws-sdk
    
      - name: listObject aws-sdki
        env:
          LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}
          LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
          LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
          LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
        run: |
          node node-js/listObject.js
          echo -e "\033[1;31mSuccessful connection to cloud storage s3 bucket..."
          node node-js/uploadFile.js
          echo -e "\033[1;31mSuccessful get object from cloud storage s3 bucket..."
 
