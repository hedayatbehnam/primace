on:
  push:
    branches: [main, pkgdown-v]
  pull_request:
    branches: [main, pkgdown-v]

name: Check-New-Dataset

jobs:
  check-new-dataset-presence:
    runs-on: ubuntu-latest
    name: Check Uploaded New Dataset File 
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      GIT_PAT: ${{ secrets.GITHUB_TOKEN }}
      LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
      LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
      LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
      LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}
    
    steps:
      - uses: actions/checkout@v3
    
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      
      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'
      
      - name: Install texlive
        run : |
            sudo apt-get install texlive
            sudo apt-get install texlive-fonts-extra
      
      - name: Find Last Modified File in R/dataset directory
        id: changed-files-specific
        uses: tj-actions/changed-files@v35
        with:
          files: |
            R/datasets/dataset.RDS
      - name: Check File Last Modification - SUCCESS
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        run : |
            devtools::load_all(".")
            devtools::build()
            library(primace)
            primace::preprocessing()
        shell : Rscript {0}
      
      - name: Check File Last Modification - FAILURE
        if: steps.changed-files-specific.outputs.any_changed == 'false'
        run: |
          echo -e "\033[1;31mNo new dataset file has been added..."
      