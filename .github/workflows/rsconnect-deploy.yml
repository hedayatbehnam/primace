on:
  push:
    branches: [main, arg-pkg]
  pull_request:
    branches: [main, arg-pkg]
    
name: shinyapss-io redirect

jobs:
  redirect:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      
    
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - name: install-dependencies
        run: |
          install.packages(c("rsconnect", "shiny"))
        shell: Rscript {0}
        
      - name: Push to shiny.io
        run: |
          rsconnect::setAccountInfo(name='behnam-hedayat', token="${{secrets.SHINYAPPS_TOKEN}}", secret="${{secrets.SHINYAPPS_SECRET}}")
          rsconnect::deployApp(appDir = 'shinyapps-io/')
        shell: Rscript {0}