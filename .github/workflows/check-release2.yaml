on:
  push:
    branches: [main, packaged-v, v3, pkgdown-v]

name: R-CMD-check

jobs:

  R-CMD-check2:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
      LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
      LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
      LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'
  
      - name: R CMD CHECK inside r
        run : |
            install.packages("devtools")
            renv::restore()
            tryCatch(Sys.setenv(s3 = paws::s3(config=list(endpoint = paste0("https://",suppressWarnings(system("printenv LIARA_ENDPOINT", intern = T))), access_key_id = suppressWarnings(system("printenv LIARA_ACCESS_KEY", intern = T)), secret_access_key = suppressWarnings(system("printenv LIARA_SECRET_KEY", intern = T)), region="default"))), error = function(e) invisible())
            print(s3)
        shell : Rscript {0}

