on:
  push:
    branches: [main]

name: Continuous-Deployment

jobs:

  Docker-Build-Push:
    uses: ./.github/workflows/Docker-Build-Push.yml

  CD_Liara:
    runs-on: ubuntu-latest
    needs: Docker-Build-Push

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "16"
      - name: update-liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_TOKEN }}
        run : |
          npm i -g @liara/cli@3
          liara deploy --app="primace" --api-token="$LIARA_TOKEN" --image="bhedayat/test-primace" --port=3838  --detach 
