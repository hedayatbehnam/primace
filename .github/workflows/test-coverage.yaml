# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, packaged-v, v3]
  pull_request:
    branches: [main, master, packaged-v, v3]

name: test-coverage

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'

      - name: test-coverage
        run : |
          install.packages("mlr3")
          install.packages("mlr3learners")
          install.packages("mlr3measures")
          install.packages("mlr3tuning")
          install.packages("mlr3misc")
          devtools::install_github("mlr-org/mlr3extralearners")
          options(repos = c(raphaels1 = "https://raphaels1.r-universe.dev",mlrorg = "https://mlr-org.r-universe.dev",CRAN = 'https://cloud.r-project.org'))
          install.packages("mlr3proba")
          remotes::install_version("mlr3viz", version = "0.5.10")
          remotes::install_cran(c("covr", "DT"))
          devtools::load_all(".")
          test_cov <- devtools::test_coverage(".")
          print(test_cov)
        shell : Rscript {0}

