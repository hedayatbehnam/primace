on:
  schedule:
    - cron: '15 9 * * 1-5'
    
jobs:
  web_app-availability:
    runs-on: ubuntu-latest
    steps:
      - name: curl PRIMACE
        run: |
          PRIMACE=$(curl --silent https://primace.aikadeh.com)
          echo $PRIMACE
          if [[ $PRIMACE ]]; then echo Done; else echo "Error" 1>&2 && exit 64; fi
          
          
