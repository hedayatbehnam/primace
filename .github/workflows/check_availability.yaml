name: Check-Web-App-Availability

on:
  schedule:
    # Runs "At 11:00 on every day-of-week from Monday through Friday"
    - cron: '0 8 * * 1-5'
    
jobs:
  build:
    name: Web-App-Availability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: curl PRIMACE
        run: |
          PRIMACE=$(curl --silent localhost:3838)
          echo $PRIMACE
          if [[ $PRIMACE ]]; then echo Done; else echo "Error" 1>&2 && exit 64; fi
          
          