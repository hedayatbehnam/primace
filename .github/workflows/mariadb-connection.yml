on:
  push:
   branches: [arg-pkg]

name: MariaDB-Connection

jobs:
  mariadb-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: getong/mariadb-action@v1.1
        with:
          host port: 3306 # Optional, default value is 3306. The port of host
          container port: 3306 # Optional, default value is 3306. The port of container
          character set server: 'utf8' # Optional, default value is 'utf8mb4'. The '--character-set-server' option for mysqld
          mysql user: ${{ secrets.MARIADB_USR }} # Required if "mysql root password" is empty, default is empty. The superuser for the specified database. Can use secrets, too
          mysql password: ${{ secrets.MARIADB_PW }} # Required if "mysql user" exists. The password for the "mysql user"
      