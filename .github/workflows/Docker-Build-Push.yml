on:
  workflow_run:
    workflows: ['R-CMD-Check']
    types: [completed]
    
name: Docker-Build-Push

jobs:

  rcmdcheck-success:
  
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TEST_TAG: bhedayat/test-primace:test
      LATEST_TAG: bhedayat/test-primace:latest
      LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
      LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
      LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
      LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build and export to Docker
        uses: docker/build-push-action@v3
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: |
            GIT_PAT=${{ secrets.GITHUB_TOKEN }}
            LIARA_ENDPOINT=${{ secrets.LIARA_ENDPOINT }}
            LIARA_BUCKET_NAME=${{ secrets.LIARA_BUCKET_NAME }}
            LIARA_ACCESS_KEY=${{ secrets.LIARA_ACCESS_KEY }}
            LIARA_SECRET_KEY=${{ secrets.LIARA_SECRET_KEY }}
    
      - name: Test
        run : |
          echo "Starting docker..." &&
          docker run -d -p 3838:3838 --rm ${{ env.TEST_TAG }} & 
          echo "Docker run successfully..." &&
          sleep 10 &&
          echo "Sleep terminated..." &&
          if [[ $(curl --silent 0.0.0.0:3838) ]]; then echo Done; else echo "Error" 1>&2 && exit 64; fi
          
      - name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: ${{ env.LATEST_TAG }} 
          build-args: |
            GIT_PAT=${{ secrets.GITHUB_TOKEN }}
            LIARA_ENDPOINT=${{ secrets.LIARA_ENDPOINT }}
            LIARA_BUCKET_NAME=${{ secrets.LIARA_BUCKET_NAME }}
            LIARA_ACCESS_KEY=${{ secrets.LIARA_ACCESS_KEY }}
            LIARA_SECRET_KEY=${{ secrets.LIARA_SECRET_KEY }}
            
  rcmdcheck-failed:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: "Failed due to R-CMD-Check failure"
