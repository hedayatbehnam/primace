# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, packaged-v, v3, pkgdown-v]

name: R-CMD-check

jobs:

  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'
  
      - name: install texlive
        run : |
            sudo apt-get install texlive
            sudo apt-get install texlive-fonts-extra

      - name: R CMD CHECK inside r
        run : |
            install.packages("devtools")
            renv::restore()
            install.packages("mlr3")
            install.packages("mlr3learners")
            install.packages("mlr3measures")
            install.packages("mlr3tuning")
            install.packages("mlr3misc")
            devtools::install_github("mlr-org/mlr3extralearners")
            devtools::install_github("mlr-org/mlr3proba")
            devtools::install_version("mlr3viz", version = "0.5.10")
            rcmdcheck::rcmdcheck(error_on="warning")
        shell : Rscript {0}

      - name: Find Last Modified File in R/dataset directory
        id: changed-files-specific
        uses: tj-actions/changed-files@v35
        with:
          files: |
            R/datasets/dataset.RDS

      - name: Check File Last Modification - SUCCESS
        if: steps.changed-files-specific.outputs.any_changed == 'true'
        run : |
          devtools::load_all(".")
          devtools::build()
          library(primace)
          primace::preprocessing()
        shell : Rscript {0}
          
      - name: Check File Last Modification - FAILURE
        if: steps.changed-files-specific.outputs.any_changed == 'false'
        run: |
          echo -e "\033[1;31mNo new dataset file has been added..."
        

  docker:
    runs-on: ubuntu-latest
    needs: R-CMD-check
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TEST_TAG: bhedayat/test-primace:test
      LATEST_TAG: bhedayat/test-primace:latest
    
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and export to Docker
        uses: docker/build-push-action@v3
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: |
            GIT_PAT=${{ secrets.GITHUB_TOKEN }}
      -
        name: Test
        run: |
          
          docker run -d -p 3838:3838 --rm ${{ env.TEST_TAG }}
          PRIMACE=$(curl --silent localhost:3838 | grep -o PRIMACE | wc -l)
          if [[ $PRIMACE ]]; then echo Done; else echo "Error" 1>&2 && exit 64; fi
      -
        name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: ${{ env.LATEST_TAG }} 
          build-args: |
            GIT_PAT=${{ secrets.GITHUB_TOKEN }}

  CD_Liara:
    runs-on: ubuntu-latest
    needs: docker 

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "16"
      - name: update-liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_TOKEN }}
        run: |
          npm i -g @liara/cli@3
          liara deploy --app="primace" --api-token="$LIARA_TOKEN" --image="bhedayat/test-primace" --port=3838  --detach 

