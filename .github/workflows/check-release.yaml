on:
  push:
    branches: [main, pkg-v2]

name: R-MLOps-Check

jobs:
      
  Check-New-Dataset:
    runs-on: ubuntu-latest
    name: Check Uploaded New Dataset File 
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      GIT_PAT: ${{ secrets.GITHUB_TOKEN }}
      LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
      LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
      LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
      LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}
    
    steps:
      - uses: actions/checkout@v3
    
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'
  
      - name: R CMD CHECK inside r
        run : |
            install.packages("devtools")
            renv::restore()
            install.packages("mlr3")
            install.packages("mlr3learners")
            install.packages("mlr3measures")
            install.packages("mlr3tuning")
            install.packages("mlr3misc")
            devtools::install_github("mlr-org/mlr3extralearners")
            devtools::install_github("mlr-org/mlr3proba")
            devtools::install_version("mlr3viz", version = "0.5.10")
            devtools::load_all(".")
            primace::preprocessing()
        shell : Rscript {0}

      - name: install paws package
        run : |
          install.packages("paws")
        shell : Rscript {0}
        
      - name: connect to aws s3 bucket - find last modifications time
        run : ./.github/scripts/lastMod.sh
        shell: bash
  
        
