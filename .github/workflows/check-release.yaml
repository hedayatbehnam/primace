on:
  push:
    branches: [main, pkg-renv]

name: R-MLOps-Check

jobs:

  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
      LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
      LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
      LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'
  
      - name: install texlive
        run : |
            sudo apt-get install texlive
            sudo apt-get install texlive-fonts-extra
            
      - name: R CMD CHECK inside r
        run : |
            renv::activate()
            renv::restore()
            rcmdcheck::rcmdcheck(error_on="warning")
        shell : Rscript {0}
        
      - name: test-coverage
        run : |
            install.packages(c("covr", "DT"))
            devtools::load_all(".")
            test_cov <- devtools::test_coverage(".")
            print(test_cov)
        shell : Rscript {0}
      

  liara_cloud_storage-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "16"
          
      - name: install aws-sdk
        run: |
          npm install aws-sdk
    
      - name: listObject aws-sdki
        env:
          LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}
          LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
          LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
          LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
        run: |
          node node-js/listObject.js
          echo -e "\033[1;31mSuccessful connection to cloud storage s3 bucket..."
          node node-js/uploadFile.js
          echo -e "\033[1;31mSuccessful get object from cloud storage s3 bucket..."
 
 
  Check-New-Dataset:
    runs-on: ubuntu-latest
    name: Check Uploaded New Dataset File 
    needs: [R-CMD-check, liara_cloud_storage-check]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      GIT_PAT: ${{ secrets.GITHUB_TOKEN }}
      LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
      LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
      LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
      LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}
    
    steps:
      - uses: actions/checkout@v3
    
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'
  
      - name: connect to aws s3 bucket - find last modifications time
        run : |
            DATASET=$(Rscript helper/check_lastModification.R)
            echo $DATASET
            Rscript -e "install.packages('devtools')"
            Rscript -e "renv::activate()"
            Rscript -e "renv::restore()"
            Rscript -e "devtools::load_all('.')"
            R CMD build .
            R CMD INSTALL primace_0.0.0.9000.tar.gz
            Rscript -e "library('primace')"
            if [ "$DATASET" == "[1] FALSE" ]; then echo "Dataset has not been modified"
            elif [ "$DATASET" == "[1] TRUE" ]; then echo "Dataset has been modified" && Rscript -e "primace::preprocessing()"
            elif [ "$DATASET" == "[1] NULL" ]; then echo "No Dataset was found"
            else echo "Failed to access bucket"; fi
        shell: bash
  
  Docker-push-pull:
    runs-on: ubuntu-latest
    needs: R-CMD-check
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TEST_TAG: bhedayat/test-primace:test
      LATEST_TAG: bhedayat/test-primace:latest
      LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
      LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
      LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
      LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}
    
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and export to Docker
        uses: docker/build-push-action@v3
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: |
            GIT_PAT=${{ secrets.GITHUB_TOKEN }}
            LIARA_ENDPOINT=${{ secrets.LIARA_ENDPOINT }}
            LIARA_BUCKET_NAME=${{ secrets.LIARA_BUCKET_NAME }}
            LIARA_ACCESS_KEY=${{ secrets.LIARA_ACCESS_KEY }}
            LIARA_SECRET_KEY=${{ secrets.LIARA_SECRET_KEY }}
      -
        name: Test
        run : |
          
          docker run -d -p 3838:3838 --rm ${{ env.TEST_TAG }}
          echo "\033[1;31mDocker run Done...!"
          sleep 5
          echo "\033[1;31mSleep terminated"
          PRIMACE=$(curl --silent localhost:3838)
          echo "\033[1;31mCurling finished...!"
          echo $PRIMACE
          if [[ $PRIMACE ]]; then echo Done; else echo "Error" 1>&2 && exit 64; fi
      -
        name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: ${{ env.LATEST_TAG }} 
          build-args: |
            GIT_PAT=${{ secrets.GITHUB_TOKEN }}
            LIARA_ENDPOINT=${{ secrets.LIARA_ENDPOINT }}
            LIARA_BUCKET_NAME=${{ secrets.LIARA_BUCKET_NAME }}
            LIARA_ACCESS_KEY=${{ secrets.LIARA_ACCESS_KEY }}
            LIARA_SECRET_KEY=${{ secrets.LIARA_SECRET_KEY }}
  CD_Liara:
    runs-on: ubuntu-latest
    needs: Docker-push-pull

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "16"
      - name: update-liara
        env:
          LIARA_TOKEN: ${{ secrets.LIARA_TOKEN }}
        run : |
          npm i -g @liara/cli@3
          liara deploy --app="primace" --api-token="$LIARA_TOKEN" --image="bhedayat/test-primace" --port=3838  --detach 
