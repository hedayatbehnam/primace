on:
  push:
    branches: [main, packaged-v, v3, pkgdown-v]

name: R-CMD-check

jobs:

  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
      LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
      LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
      LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'
  
      - name: install texlive
        run : |
            sudo apt-get install texlive
            sudo apt-get install texlive-fonts-extra

      - name: R CMD CHECK inside r
        run : |
            chk <- system("printenv LIARA_ENDPOINT", intern = T)
            print(chk)
            install.packages("devtools")
            renv::restore()
            install.packages("mlr3")
            install.packages("mlr3learners")
            install.packages("mlr3measures")
            install.packages("mlr3tuning")
            install.packages("mlr3misc")
            devtools::install_github("mlr-org/mlr3extralearners")
            devtools::install_github("mlr-org/mlr3proba")
            devtools::install_version("mlr3viz", version = "0.5.10")
            rcmdcheck::rcmdcheck(error_on="warning")
        shell : Rscript {0}
