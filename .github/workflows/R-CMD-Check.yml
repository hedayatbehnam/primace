on: 
  push:
    branches: [main, arg-pkg]
    
  schedule:
    - cron: '* 9 * * *'

name: R-CMD-Check

jobs:

  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
      LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
      LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
      LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'
  
      - name: install texlive
        run : |
            sudo apt-get install texlive
            sudo apt-get install texlive-fonts-extra
            
      - name: R CMD CHECK inside r
        run : |
            renv::activate()
            renv::restore()
            rcmdcheck::rcmdcheck(error_on="warning")
        shell : Rscript {0}
        
      - name: test-coverage
        run : |
            install.packages(c("covr", "DT"))
            devtools::load_all(".")
            test_cov <- devtools::test_coverage(".")
            print(test_cov)
        shell : Rscript {0}
      
