on:
  push:
    branches: [main, master, pkgdown-v]
  pull_request:
    branches: [main, master, pkgdown-v]

name: check-test-coverage

jobs:
  check-test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
  
    steps:
      - uses: actions/checkout@v3
    
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
    
      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'
    
      - name: test-coverage
        run : |
            install.packages("devtools")
            # renv::restore()
            install.packages("mlr3")
            install.packages("mlr3learners")
            install.packages("mlr3measures")
            install.packages("mlr3tuning")
            install.packages("mlr3misc")
            devtools::install_github("mlr-org/mlr3extralearners")
            devtools::install_github("mlr-org/mlr3proba")
            devtools::install_version("mlr3viz", version = "0.5.10")
            install.packages(c("covr", "DT", "devtools"))
            devtools::load_all(".")
            test_cov <- devtools::test_coverage(".")
            print(test_cov)
        shell : Rscript {0}