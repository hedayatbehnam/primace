on:
  push:
    branches: [main, master, pkgdown-v]

name: check-test-coverage

jobs:
  check-test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
      LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
      LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
      LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}
  
    steps:
      - uses: actions/checkout@v3
    
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
    
      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'
    
      - name: test-coverage
        run : |
            install.packages("devtools")
            install.packages(c("covr", "DT"))
            renv::restore()
            devtools::load_all(".")
            test_cov <- devtools::test_coverage(".")
            print(test_cov)
        shell : Rscript {0}