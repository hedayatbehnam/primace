on:
  push:
    branches: [main, arg-pkg]
    
  schedule:
    - cron: '0 10 * * *'

name: Check-Data-Modification

jobs:
 
  Check-New-Dataset:
    runs-on: ubuntu-latest
    name: Check Uploaded New Dataset File 
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      GIT_PAT: ${{ secrets.GITHUB_TOKEN }}
      LIARA_ENDPOINT: ${{ secrets.LIARA_ENDPOINT }}
      LIARA_BUCKET_NAME: ${{ secrets.LIARA_BUCKET_NAME }}
      LIARA_ACCESS_KEY: ${{ secrets.LIARA_ACCESS_KEY }}
      LIARA_SECRET_KEY: ${{ secrets.LIARA_SECRET_KEY }}
    
    steps:
      - uses: actions/checkout@v3
    
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - uses: r-lib/actions/setup-renv@v2
        with:
          profile: '"shiny"'
  
      - name: connect to aws s3 bucket - find last modifications time
        run : |
            DATASET=$(Rscript helper/check_lastModification.R)
            echo $DATASET
            if [ "$DATASET" == "[1] FALSE" ]; then echo "Dataset has not been modified"
            elif [ "$DATASET" == "[1] TRUE" ]; then echo "Dataset has been modified"
            elif [ "$DATASET" == "[1] NULL" ]; then echo "No Dataset was found" 1>&2 && exit 64
            else echo "Failed to access bucket"; fi
        shell: bash
